  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      font-family: 'EB Garamond', serif;
      min-height: 100vh;
      padding: 52px 56px 80px;
    }

    .page-title {
      font-size: 13px;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .page-links {
      display: flex;
      gap: 24px;
      margin-bottom: 48px;
      font-size: 13px;
    }

    .page-links a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      body { padding: 32px 20px 60px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    }

    /* CARD */
    .card {
      cursor: pointer;
      position: relative;
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f5f5f5;
    }

    .card-info {
      padding: 6px 0 0;
    }

    .card-name {
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .card-meta {
      font-size: 10px;
      color: #888;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-status {
      font-size: 10px;
      font-style: italic;
    }

    .card-status.sold { color: #aaa; }
    .card-status.available { color: #111; }
    .card-status.nfs { color: #aaa; }
    .card-status.traded { color: #aaa; }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.97);
      z-index: 1000;
      padding: 40px;
      overflow-y: auto;
    }

    .lightbox.active { display: flex; flex-direction: column; }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 32px;
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      cursor: pointer;
      background: none;
      border: none;
      color: #111;
      z-index: 1001;
    }

    .lightbox-title {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .lightbox-meta {
      font-size: 12px;
      color: #888;
      font-style: italic;
      margin-bottom: 24px;
    }

    .lightbox-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (max-width: 600px) {
      .lightbox { padding: 20px; }
      .lightbox-images { grid-template-columns: repeat(2, 1fr); }
    }

    .lightbox-images img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f5f5f5;
    }
  </style>
</head>

        <div class="card-info">

          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    function openLightbox(i) {
      const item = items[i];
      document.getElementById('lb-title').textContent = item.name;
      document.getElementById('lb-meta').textContent = `Size ${item.size} · ${item.status === 'nfs' ? 'NFS' : item.status === 'traded' ? 'Traded' : item.status === 'sold' ? 'Sold · ' + item.price : item.price}`;
      const imgs = document.getElementById('lb-images');
      imgs.innerHTML = item.images.map(src => `<img src="${src}" alt="${item.name}" loading="lazy"/>`).join('');
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

      if (e.target === this) closeLightbox();
    });
